name: voxready-azure

x-api-build: &api-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

x-api-env: &api-env
  SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env con la conexion ODBC de Azure SQL}
  ENVIRONMENT: production
  DEV_AUTH: ${DEV_AUTH:-false}
  JWKS_URL: ${JWKS_URL:?Define JWKS_URL en .env}
  JWT_ISSUER: ${JWT_ISSUER:?Define JWT_ISSUER en .env}
  JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE en .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING:?Define STORAGE_CONNECTION_STRING para grabaciones y reportes en Azure}
  STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:-${BLOB_CONTAINER_NAME:-recordings}}
  SERVICE_BUS_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING:?Define SERVICE_BUS_CONNECTION_STRING para el worker de Azure}
  SERVICE_BUS_QUEUE_NAME: ${SERVICE_BUS_QUEUE_NAME:-analysis-queue}

services:
  init:
    image: voxready-api:${VOXREADY_IMAGE_TAG:-latest}
    build: *api-build
    environment:
      SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env}
    command: ["python", "scripts/prepare_azure_database.py"]
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: voxready-api:${VOXREADY_IMAGE_TAG:-latest}
    build: *api-build
    environment: *api-env
    ports:
      - "${VOXREADY_API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    image: voxready-client:${VOXREADY_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_AUTH_MODE: azure
        NEXT_PUBLIC_DEV_AUTH: ${NEXT_PUBLIC_DEV_AUTH:-false}
        NEXT_PUBLIC_API_URL: ${VOXREADY_DOCKER_API_URL:-http://localhost:8000/v1}
        NEXT_PUBLIC_AZURE_TENANT_ID: ${NEXT_PUBLIC_AZURE_TENANT_ID:?Define NEXT_PUBLIC_AZURE_TENANT_ID en .env}
        NEXT_PUBLIC_AZURE_CLIENT_ID: ${NEXT_PUBLIC_AZURE_CLIENT_ID:?Define NEXT_PUBLIC_AZURE_CLIENT_ID en .env}
        NEXT_PUBLIC_AZURE_AUTHORITY: ${NEXT_PUBLIC_AZURE_AUTHORITY:?Define NEXT_PUBLIC_AZURE_AUTHORITY en .env}
        NEXT_PUBLIC_REDIRECT_URI: ${VOXREADY_DOCKER_REDIRECT_URI:-${NEXT_PUBLIC_REDIRECT_URI:-${NEXT_PUBLIC_AZURE_REDIRECT_URI:-http://localhost:3000}}}
        NEXT_PUBLIC_AZURE_REDIRECT_URI: ${VOXREADY_DOCKER_REDIRECT_URI:-${NEXT_PUBLIC_REDIRECT_URI:-${NEXT_PUBLIC_AZURE_REDIRECT_URI:-http://localhost:3000}}}
        NEXT_PUBLIC_AZURE_API_SCOPE: ${NEXT_PUBLIC_AZURE_API_SCOPE:?Define NEXT_PUBLIC_AZURE_API_SCOPE en .env}
    ports:
      - "${VOXREADY_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test-api:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      <<: *api-env
      VOXREADY_TEST_AZURE_SQL: "1"
    depends_on:
      init:
        condition: service_completed_successfully

  test-client:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
