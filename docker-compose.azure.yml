name: voxready-azure

x-api-build: &api-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

x-api-env: &api-env
  SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env con la conexion ODBC de Azure SQL}
  ENVIRONMENT: production
  DEV_AUTH: "false"
  JWKS_URL: ${JWKS_URL:?Define JWKS_URL en .env}
  JWT_ISSUER: ${JWT_ISSUER:?Define JWT_ISSUER en .env}
  JWT_AUDIENCE: ${JWT_AUDIENCE:?Define JWT_AUDIENCE en .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en .env}
  STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING:?Define STORAGE_CONNECTION_STRING para grabaciones y reportes en Azure}
  STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:?Define STORAGE_CONTAINER_NAME en .env}
  STORAGE_RECORDING_PREFIX: ${STORAGE_RECORDING_PREFIX:?Define STORAGE_RECORDING_PREFIX en .env}
  STORAGE_MICROLESSON_PREFIX: ${STORAGE_MICROLESSON_PREFIX:?Define STORAGE_MICROLESSON_PREFIX en .env}
  STORAGE_REPORT_CONTAINER_NAME: ${STORAGE_REPORT_CONTAINER_NAME:?Define STORAGE_REPORT_CONTAINER_NAME en .env}
  STORAGE_REPORT_PREFIX: ${STORAGE_REPORT_PREFIX:-}
  MICROLESSON_VIDEO_MAX_BYTES: ${MICROLESSON_VIDEO_MAX_BYTES:-262144000}
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:?Define MAX_UPLOAD_SIZE_BYTES en .env}
  UPLOAD_URL_TTL_MINUTES: ${UPLOAD_URL_TTL_MINUTES:?Define UPLOAD_URL_TTL_MINUTES en .env}
  READ_URL_TTL_MINUTES: ${READ_URL_TTL_MINUTES:?Define READ_URL_TTL_MINUTES en .env}
  WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:?Define WORKER_INTERNAL_URL en .env}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define INTERNAL_SERVICE_TOKEN en .env}

services:
  init:
    image: voxready-api:${VOXREADY_IMAGE_TAG:-latest}
    build: *api-build
    environment:
      SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env}
      DEV_AUTH: ${DEV_AUTH:-false}
    command: ["python", "scripts/prepare_azure_database.py"]
    healthcheck:
      disable: true
    restart: "no"

  api:
    image: voxready-api:${VOXREADY_IMAGE_TAG:-latest}
    build: *api-build
    environment: *api-env
    ports:
      - "${VOXREADY_API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    restart: unless-stopped

  vision:
    image: voxready-vision:${VOXREADY_IMAGE_TAG:-latest}
    build:
      context: ./voxready-vision
      dockerfile: Dockerfile
    environment:
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:?Define VISION_SERVICE_TOKEN en .env}
      VISION_MAX_FRAME_BYTES: ${VISION_MAX_FRAME_BYTES:?Define VISION_MAX_FRAME_BYTES en .env}
      VISION_MAX_BATCH_FRAMES: ${VISION_MAX_BATCH_FRAMES:?Define VISION_MAX_BATCH_FRAMES en .env}
      VISION_FACE_MODEL_PATH: ${VISION_FACE_MODEL_PATH:-/opt/mediapipe-models/face_landmarker.task}
      VISION_POSE_MODEL_PATH: ${VISION_POSE_MODEL_PATH:-/opt/mediapipe-models/pose_landmarker_lite.task}
    restart: unless-stopped

  worker:
    image: voxready-worker:${VOXREADY_IMAGE_TAG:-latest}
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: runtime
    environment:
      SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env}
      STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING:?Define STORAGE_CONNECTION_STRING en .env}
      STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:?Define STORAGE_CONTAINER_NAME en .env}
      STORAGE_REPORT_CONTAINER_NAME: ${STORAGE_REPORT_CONTAINER_NAME:?Define STORAGE_REPORT_CONTAINER_NAME en .env}
      STORAGE_REPORT_PREFIX: ${STORAGE_REPORT_PREFIX:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define INTERNAL_SERVICE_TOKEN en .env}
      VISION_SERVICE_URL: http://vision:8000
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:?Define VISION_SERVICE_TOKEN en .env}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?Define NVIDIA_API_KEY en .env}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:?Define NVIDIA_BASE_URL en .env}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:?Define LLM_MODEL_NAME en .env}
      LLM_FALLBACK_MODEL_NAME: ${LLM_FALLBACK_MODEL_NAME:-}
      NVIDIA_RIVA_SERVER: ${NVIDIA_RIVA_SERVER:?Define NVIDIA_RIVA_SERVER en .env}
      NVIDIA_FUNCTION_ID: ${NVIDIA_FUNCTION_ID:?Define NVIDIA_FUNCTION_ID en .env}
      NVIDIA_LANGUAGE_CODE: ${NVIDIA_LANGUAGE_CODE:?Define NVIDIA_LANGUAGE_CODE en .env}
    depends_on:
      vision:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: voxready-client:${VOXREADY_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_AUTH_MODE: azure
        NEXT_PUBLIC_DEV_AUTH: "false"
        NEXT_PUBLIC_API_URL: ${VOXREADY_DOCKER_API_URL:?Define VOXREADY_DOCKER_API_URL en .env}
        NEXT_PUBLIC_AZURE_TENANT_ID: ${NEXT_PUBLIC_AZURE_TENANT_ID:?Define NEXT_PUBLIC_AZURE_TENANT_ID en .env}
        NEXT_PUBLIC_AZURE_CLIENT_ID: ${NEXT_PUBLIC_AZURE_CLIENT_ID:?Define NEXT_PUBLIC_AZURE_CLIENT_ID en .env}
        NEXT_PUBLIC_AZURE_AUTHORITY: ${NEXT_PUBLIC_AZURE_AUTHORITY:?Define NEXT_PUBLIC_AZURE_AUTHORITY en .env}
        NEXT_PUBLIC_REDIRECT_URI: ${VOXREADY_DOCKER_REDIRECT_URI:?Define VOXREADY_DOCKER_REDIRECT_URI en .env}
        NEXT_PUBLIC_AZURE_REDIRECT_URI: ${VOXREADY_DOCKER_REDIRECT_URI:?Define VOXREADY_DOCKER_REDIRECT_URI en .env}
        NEXT_PUBLIC_AZURE_API_SCOPE: ${NEXT_PUBLIC_AZURE_API_SCOPE:?Define NEXT_PUBLIC_AZURE_API_SCOPE en .env}
    ports:
      - "${VOXREADY_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test-api:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      <<: *api-env
      VOXREADY_TEST_AZURE_SQL: "1"
    depends_on:
      init:
        condition: service_completed_successfully

  test-client:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test

  test-worker:
    profiles: ["test"]
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: test
    environment:
      SQL_CONNECTION_STRING: ${SQL_CONNECTION_STRING:?Define SQL_CONNECTION_STRING en .env}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:?Define VISION_SERVICE_URL en .env}
      VISION_SERVICE_TOKEN: ${VISION_SERVICE_TOKEN:?Define VISION_SERVICE_TOKEN en .env}
      VOXREADY_TEST_AZURE_SQL: "1"
