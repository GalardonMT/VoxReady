# Run with: docker compose -p voxready-local -f docker-compose.local.yml up --build -d --wait
# The project name separates this demo from the Azure-backed Compose deployment.
x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://voxready:voxready@db:5432/voxready
  ENVIRONMENT: development
  DEV_AUTH: "true"
  DEV_AUTH_SECRET: local-demo-secret-only-change-before-sharing
  UPLOAD_SIGNING_SECRET: local-demo-upload-secret
  WEBHOOK_SECRET: local-demo-webhook-secret
  CORS_ORIGINS: http://localhost:${VOXREADY_LOCAL_WEB_PORT:-3100}
  STORAGE_DIR: /data/storage
  ENABLE_RETENTION_JOB: "false"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voxready
      POSTGRES_PASSWORD: voxready
      POSTGRES_DB: voxready
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxready -d voxready"]
      interval: 30s
      timeout: 3s
      retries: 10

  init:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    environment: *api-env
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${VOXREADY_LOCAL_API_PORT:-8100}:8000"
    volumes:
      - ./backend:/code
      - local_storage:/data/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_AUTH_MODE: local
      NEXT_PUBLIC_API_URL: http://localhost:${VOXREADY_LOCAL_API_PORT:-8100}/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${VOXREADY_LOCAL_WEB_PORT:-3100}:3000"
    volumes:
      - ./frontend:/app
      - local_node_modules:/app/node_modules
      - local_next:/app/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  local_pgdata:
  local_storage:
  local_node_modules:
  local_next:
